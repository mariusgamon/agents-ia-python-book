# Lancez les tests depuis day5/ :  cd day5 && pytest tests/
[pytest]
pythonpath = .
testpaths = tests
# Une seule boucle asyncio pour toute la session : le client OpenAI du SDK réutilise
# ses connexions HTTP, qui restent liées à la boucle du premier test.
# Sans ça : « RuntimeError: Event loop is closed » à partir du 2e test qui appelle le LLM.
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
